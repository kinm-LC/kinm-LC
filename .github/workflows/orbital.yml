name: Atualizar Orbital
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/orbital.yml'
permissions:
  contents: write
concurrency:
  group: orbital-profile
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Consultar GitHub e gerar painéis
        run: node scripts/update.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salvar atualizações
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets preview.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: atualizar telemetria orbital"
          git push
